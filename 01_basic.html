<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Variable Demo</title>
</head>
<body>
    <h1>Variable Declaration Demo (var, let, const)</h1>
    <pre id="output"></pre>

    <script>
        // === 1. Declarations using var, let, and const ===

        // var (function-scoped, can be redeclared and reassigned)
        var myString = "Hello, Bhavnagar! 👋";
        var myNumber = 42;
        var myBoolean = true;

        // let (block-scoped, cannot be redeclared, can be reassigned)
        let myNull = null;
        let myUndefined = undefined;

        // const (block-scoped, cannot be redeclared or reassigned, but objects/arrays can be mutated)
        const myObject = {
            name: "Keyur",
            city: "Bhavnagar",
            isActive: true
        };

      
    </script>
</body>
</html>
